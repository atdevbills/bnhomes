<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BN Homes — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1d4ed8; --wa:#128c4a; --black:#0a0d12; --line:#dce1ea;
  --muted:#5b6578; --plaster:#f2f5fa; --red:#dc2626;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.55 var(--sans);color:#0d1117;background:var(--plaster);min-height:100vh}
a{color:var(--blue)}
button{cursor:pointer;font:inherit}
input,textarea,select{font:inherit;color:inherit;width:100%}

.login{max-width:380px;margin:8vh auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.login h1{font:400 2rem/1.1 var(--serif);margin-bottom:6px}
.login p{color:var(--muted);margin-bottom:20px;font-size:.92rem}
.login label{display:block;margin-bottom:12px}
.login label span{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
.login input{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:0}
.login input:focus{border-color:var(--blue)}
.login button{width:100%;min-height:46px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;margin-top:6px}
.login .err{color:var(--red);font-size:.88rem;margin-top:10px;min-height:20px}

.app{display:none}
.app.show{display:block}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
header.top .bar{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font:400 1.4rem/1 var(--serif)}
header.top h1 span{color:var(--muted);font:400 .85rem var(--sans);margin-left:8px}
header.top .who{color:var(--muted);font-size:.85rem}
header.top button{min-height:38px;padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;font-weight:600}

main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.toolbar h2{font:400 1.6rem/1 var(--serif)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:8px 16px;border:1px solid var(--blue);border-radius:8px;background:var(--blue);color:#fff;font-weight:600;text-decoration:none}
.btn.line{background:#fff;color:var(--blue)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{min-height:34px;padding:5px 12px;font-size:.86rem}
.btn:disabled{opacity:.6;cursor:not-allowed}

.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:680px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.pcard .img{aspect-ratio:4/3;background:var(--line);position:relative}
.pcard .img img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .img .n{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;padding:2px 8px;border-radius:999px;font-size:.75rem}
.pcard .img .feat{position:absolute;left:8px;top:8px;background:#f59e0b;color:#fff;padding:2px 8px;border-radius:4px;font-size:.72rem;font-weight:600}
.pcard .info{padding:12px;flex:1;display:flex;flex-direction:column;gap:4px}
.pcard .price{color:var(--blue);font:400 1.3rem var(--serif)}
.pcard h3{font-size:.98rem;font-weight:600}
.pcard .meta{color:var(--muted);font-size:.85rem}
.pcard .acts{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fafbfd}
.pcard .acts button{flex:1}
.empty{text-align:center;padding:40px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}

.modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(6,10,20,.6);overflow-y:auto;padding:20px 12px}
.modal.show{display:block}
.dialog{max-width:760px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden}
.dialog header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dialog header h3{font:400 1.4rem var(--serif)}
.dialog header button{border:0;background:transparent;font-size:1.5rem;line-height:1;color:var(--muted)}
.dialog form{padding:18px;display:grid;gap:14px}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(min-width:600px){.row.thirds{grid-template-columns:1fr 1fr 1fr}}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;color:#333}
.field input,.field textarea,.field select{min-height:42px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}
.field textarea{min-height:80px;resize:vertical}
.field.check{display:flex;align-items:center;gap:8px}
.field.check input{width:auto;min-height:auto;width:18px;height:18px}
.field.check label{margin:0}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--plaster);border:1px solid var(--line);cursor:grab}
.thumb.dragging{opacity:.4}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb .del{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:rgba(220,38,38,.95);color:#fff;border:0;font-size:.8rem;line-height:1;display:grid;place-items:center}
.thumb .main{position:absolute;left:4px;bottom:4px;background:var(--blue);color:#fff;font-size:.68rem;padding:2px 6px;border-radius:4px}
.up{aspect-ratio:1;border:2px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);background:#fafbfd;cursor:pointer;font-size:.8rem;text-align:center;padding:4px}
.up:hover{border-color:var(--blue);color:var(--blue)}
.up input{display:none}

.dialog footer{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);background:#fafbfd}
.msg{font-size:.85rem;margin-top:6px;min-height:18px}
.msg.ok{color:var(--wa)}
.msg.err{color:var(--red)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--black);color:#fff;padding:12px 20px;border-radius:8px;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<section class="login" id="loginView">
  <h1>BN Homes Admin</h1>
  <p>Sign in to manage listings.</p>
  <form id="loginForm">
    <label><span>Email</span><input type="email" id="email" required autocomplete="email"></label>
    <label><span>Password</span><input type="password" id="password" required autocomplete="current-password"></label>
    <button type="submit" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<div class="app" id="appView">
  <header class="top">
    <div class="bar">
      <h1>Listings <span>BN Homes</span></h1>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="who" id="who"></span>
        <button id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <h2>Manage properties</h2>
      <div style="display:flex;gap:8px">
        <a class="btn line" href="index.html" target="_blank">View site</a>
        <button class="btn" id="newBtn">+ Add property</button>
      </div>
    </div>
    <div class="grid" id="list"><div class="empty">Loading…</div></div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="dialog">
    <header>
      <h3 id="modalTitle">Add property</h3>
      <button type="button" id="closeModal" aria-label="Close">×</button>
    </header>
    <form id="propForm">
      <input type="hidden" id="propId">
      <div class="row">
        <div class="field"><label>Reference</label><input id="f_ref" required placeholder="HV-001"></div>
        <div class="field"><label>Title</label><input id="f_title" required></div>
      </div>
      <div class="row">
        <div class="field"><label>Location</label><input id="f_location" required placeholder="East Legon, Accra"></div>
        <div class="field"><label>Price</label><input id="f_price" required placeholder="GH₵ 3,200,000"></div>
      </div>
      <div class="row thirds">
        <div class="field"><label>Per (optional)</label><input id="f_per" placeholder="per month"></div>
        <div class="field"><label>Type</label>
          <select id="f_type"><option>House</option><option>Apartment</option><option>Land</option><option>Commercial</option></select>
        </div>
        <div class="field"><label>Purpose</label>
          <select id="f_purpose"><option>For Sale</option><option>For Rent</option></select>
        </div>
      </div>
      <div class="row thirds">
        <div class="field"><label>Bedrooms</label><input id="f_beds" type="number" min="0" value="0"></div>
        <div class="field"><label>Bathrooms</label><input id="f_baths" type="number" min="0" value="0"></div>
        <div class="field"><label>Area / Size</label><input id="f_area" placeholder="320 m²"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="f_description"></textarea></div>

      <div class="row">
        <div class="field check"><input type="checkbox" id="f_featured"><label for="f_featured">Show first (featured)</label></div>
        <div class="field"><label>Sort order (lower = earlier)</label><input id="f_sort" type="number" value="0"></div>
      </div>

      <div class="field">
        <label>Photos (drag to reorder · first = main)</label>
        <div class="gallery" id="gallery"></div>
        <div class="msg" id="uploadMsg"></div>
      </div>

      <div class="msg err" id="formMsg"></div>
      <footer style="margin:-18px;border-top:1px solid var(--line)">
        <button type="button" class="btn line" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn" id="saveBtn">Save property</button>
      </footer>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL  = 'https://jqxtkcnqjjaqmswfhnpj.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxeHRrY25xamphcW1zd2ZobnBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ0MDYyNjAsImV4cCI6MjEwOTk4MjI2MH0.x1ImXmn1NujpArIkDL0A018O_-mmnsVkP-mxqQ0a_BM';
const BUCKET = 'property-images';

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (m) => { const t=$('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); };

let session = null, editing = null, draftImages = [];

async function init() {
  const { data } = await supabase.auth.getSession();
  session = data.session;
  showView();
  supabase.auth.onAuthStateChange((_e,s) => { session = s; showView(); });
}
function showView() {
  const on = !!session;
  $('loginView').style.display = on ? 'none' : 'block';
  $('appView').classList.toggle('show', on);
  if (on) { $('who').textContent = session.user.email; loadList(); }
}

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault(); $('loginErr').textContent=''; $('loginBtn').disabled=true;
  const { error } = await supabase.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value
  });
  $('loginBtn').disabled=false;
  if (error) $('loginErr').textContent = error.message;
});
$('logoutBtn').addEventListener('click', () => supabase.auth.signOut());

async function loadList() {
  const { data, error } = await supabase.from('properties').select('*')
    .order('featured',{ascending:false}).order('sort_order',{ascending:true}).order('updated_at',{ascending:false});
  if (error) { $('list').innerHTML = `<div class="empty">Error: ${esc(error.message)}</div>`; return; }
  if (!data.length) { $('list').innerHTML = `<div class="empty">No properties yet. Click <b>+ Add property</b>.</div>`; return; }
  $('list').innerHTML = data.map(p => `
    <article class="pcard">
      <div class="img">
        ${p.images?.[0] ? `<img src="${esc(p.images[0])}" alt="">` : `<div style="display:grid;place-items:center;height:100%;color:#8a93a5;font-size:.85rem">No photo</div>`}
        ${p.featured ? `<span class="feat">★ Featured</span>` : ''}
        ${p.images?.length>1 ? `<span class="n">${p.images.length} photos</span>`:''}
      </div>
      <div class="info">
        <div class="price">${esc(p.price)}${p.per?` <small style="color:var(--muted);font:500 .8rem var(--sans)">${esc(p.per)}</small>`:''}</div>
        <h3>${esc(p.title)}</h3>
        <div class="meta">${esc(p.location)}</div>
        <div class="meta">${esc(p.purpose)} · ${esc(p.type)}${p.beds?` · ${p.beds} bd`:''}${p.baths?` · ${p.baths} ba`:''}</div>
      </div>
      <div class="acts">
        <button class="btn line sm" data-edit="${p.id}">Edit</button>
        <button class="btn red sm" data-del="${p.id}">Delete</button>
      </div>
    </article>`).join('');
  $('list').querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openEdit(Number(b.dataset.edit)));
  $('list').querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmDelete(Number(b.dataset.del)));
}

$('newBtn').addEventListener('click', () => openEdit(null));
$('closeModal').addEventListener('click', closeModal);
$('cancelBtn').addEventListener('click', closeModal);
$('modal').addEventListener('click', (e) => { if (e.target===$('modal')) closeModal(); });

function openEdit(id) {
  editing = id; draftImages = [];
  $('formMsg').textContent=''; $('uploadMsg').textContent='';
  if (id) {
    supabase.from('properties').select('*').eq('id', id).single().then(({data,error}) => {
      if (error) return toast(error.message);
      $('modalTitle').textContent='Edit property';
      $('propId').value = data.id;
      $('f_ref').value = data.ref || '';
      $('f_title').value = data.title || '';
      $('f_location').value = data.location || '';
      $('f_price').value = data.price || '';
      $('f_per').value = data.per || '';
      $('f_type').value = data.type || 'House';
      $('f_purpose').value = data.purpose || 'For Sale';
      $('f_beds').value = data.beds ?? 0;
      $('f_baths').value = data.baths ?? 0;
      $('f_area').value = data.area || '';
      $('f_description').value = data.description || '';
      $('f_featured').checked = !!data.featured;
      $('f_sort').value = data.sort_order ?? 0;
      draftImages = [...(data.images || [])];
      renderGallery();
      $('modal').classList.add('show');
    });
  } else {
    $('modalTitle').textContent='Add property';
    $('propForm').reset();
    $('propId').value=''; $('f_beds').value=0; $('f_baths').value=0;
    $('f_featured').checked=false; $('f_sort').value=0;
    renderGallery();
    $('modal').classList.add('show');
  }
}
function closeModal() { $('modal').classList.remove('show'); editing=null; draftImages=[]; }

function renderGallery() {
  const g = $('gallery');
  g.innerHTML = draftImages.map((url,i) => `
    <div class="thumb" draggable="true" data-i="${i}">
      <img src="${esc(url)}" alt="">
      ${i===0?`<span class="main">Main</span>`:''}
      <button type="button" class="del" data-i="${i}" title="Remove">×</button>
    </div>`).join('')
    + `<label class="up"><input type="file" accept="image/*" multiple id="fileInput">+ Add photo</label>`;

  g.querySelectorAll('.del').forEach(b => b.onclick = () => {
    draftImages.splice(Number(b.dataset.i),1); renderGallery();
  });
  $('fileInput').onchange = handleUpload;

  let dragged = null;
  g.querySelectorAll('.thumb').forEach(t => {
    t.addEventListener('dragstart', e => { dragged = Number(t.dataset.i); t.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
    t.addEventListener('dragend', () => { t.classList.remove('dragging'); g.querySelectorAll('.thumb').forEach(x=>x.classList.remove('dragging')); });
    t.addEventListener('dragover', e => e.preventDefault());
    t.addEventListener('drop', e => {
      e.preventDefault();
      const target = Number(t.dataset.i);
      if (dragged === null || dragged === target) return;
      const [m] = draftImages.splice(dragged,1);
      draftImages.splice(target,0,m);
      renderGallery();
    });
  });
}

async function compress(file, maxSide=1600, quality=0.82) {
  if (!file.type.startsWith('image/')) return file;
  const img = await new Promise((res,rej) => {
    const i = new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file);
  });
  let { width:w, height:h } = img;
  if (w > h && w > maxSide) { h = h*maxSide/w; w = maxSide; }
  else if (h >= w && h > maxSide) { w = w*maxSide/h; h = maxSide; }
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', quality));
  return new File([blob], file.name.replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'});
}

async function handleUpload(e) {
  const files = [...e.target.files]; if (!files.length) return;
  const msgEl = $('uploadMsg');
  msgEl.className = 'msg';
  msgEl.textContent = `Uploading ${files.length}…`;

  if (!session) {
    msgEl.className = 'msg err';
    msgEl.textContent = 'You are not logged in. Log out and log in again.';
    return;
  }

  let okCount = 0;
  for (const original of files) {
    let file = original;
    try { file = await compress(original); } catch(err) { console.warn('compress failed', err); }

    const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
    const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;

    const { error } = await supabase.storage
      .from(BUCKET)
      .upload(path, file, { cacheControl:'31536000', upsert:false, contentType: file.type });

    if (error) {
      msgEl.className = 'msg err';
      msgEl.textContent = 'Upload failed: ' + error.message;
      console.error('Upload error:', error);
      return;
    }

    const { data } = supabase.storage.from(BUCKET).getPublicUrl(path);
    draftImages.push(data.publicUrl);
    renderGallery();
    okCount++;
  }

  msgEl.className = 'msg ok';
  msgEl.textContent = `${okCount} photo${okCount>1?'s':''} uploaded.`;
  setTimeout(()=>{ if(msgEl.textContent.startsWith(okCount)) msgEl.textContent=''; }, 2500);
}

$('propForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('saveBtn').disabled = true; $('formMsg').textContent='';
  const payload = {
    ref: $('f_ref').value.trim(),
    title: $('f_title').value.trim(),
    location: $('f_location').value.trim(),
    price: $('f_price').value.trim(),
    per: $('f_per').value.trim() || null,
    type: $('f_type').value,
    purpose: $('f_purpose').value,
    beds: Number($('f_beds').value) || 0,
    baths: Number($('f_baths').value) || 0,
    area: $('f_area').value.trim(),
    description: $('f_description').value.trim(),
    images: draftImages,
    featured: $('f_featured').checked,
    sort_order: Number($('f_sort').value) || 0,
    updated_at: new Date().toISOString()
  };
  const res = editing
    ? await supabase.from('properties').update(payload).eq('id', editing)
    : await supabase.from('properties').insert(payload);
  $('saveBtn').disabled=false;
  if (res.error) { $('formMsg').textContent = res.error.message; return; }
  toast(editing ? 'Property updated' : 'Property created');
  closeModal(); loadList();
});

async function confirmDelete(id) {
  if (!confirm('Delete this property? This cannot be undone.')) return;
  const { error } = await supabase.from('properties').delete().eq('id', id);
  if (error) return toast(error.message);
  toast('Property deleted'); loadList();
}

init();
</script>
</body>
</html>
